name: Coverage source refresh
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-source-refresh
  cancel-in-progress: false

jobs:
  marketplace-catalog:
    if: github.repository == 'PWR-LABS/affinity' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --include=dev
      - name: Build a complete official-source candidate
        run: npm run update:marketplace-catalog
        env:
          MARKETPLACE_API_KEY: ${{ secrets.MARKETPLACE_API_KEY }}
      - name: Validate before publication
        run: |
          npm run eval:catalog-transitions
          npm run typecheck
          npm run eval:production-readiness
          npm run build
      - name: Publish only verified catalog data or open a review proposal
        run: node scripts/publish-catalog-refresh.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          AFFINITY_SOURCE_AUTO_PUBLISH: ${{ vars.AFFINITY_SOURCE_AUTO_PUBLISH || 'false' }}
      - name: Verify the responding site and repeat bounded live source pairs
        run: node scripts/verify-catalog-publication.cjs
        env:
          MARKETPLACE_API_KEY: ${{ secrets.MARKETPLACE_API_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: marketplace-source-receipt
          path: |
            tmp/catalog-refresh-report.json
            tmp/catalog-publication.json
            tmp/deployed-catalog-receipt.json
            tmp/deployed-eligibility-pair.json
            tmp/deployed-plan-pair.json
          retention-days: 30
          if-no-files-found: warn

  guidance-watch:
    if: github.repository == 'PWR-LABS/affinity' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --include=dev
      - name: Watch policy documents, publication index and contact directory
        run: npm run watch:guidance
      - name: Report only a changed or unresolved review condition
        run: node scripts/report-guidance-watch.cjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: guidance-source-observations
          path: tmp/guidance-watch-report.json
          retention-days: 30
          if-no-files-found: warn
